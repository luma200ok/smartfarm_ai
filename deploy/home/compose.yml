# 홈서버 이전 도커화(이슈 #68, smartfarm_service#27 파일럿 패턴 복제) — docker compose 스택.
# 실행 위치: 이 파일이 있는 deploy/home/ 디렉터리 (.env는 같은 디렉터리에 둔다, .env.example 참고)
#
# 네트워크 구성:
#   - default(내부): api <-> streamlit 컨테이너 간 통신(현재 직접 왕래 없음, 향후 확장 대비)
#   - shared-net(외부, 사전 생성 필요: `docker network create shared-net`): api만 조인
#     — smartfarm_service backend가 컨테이너명 `smartfarm-ai`로 이 API를 호출하는 이름 계약
#       (http://smartfarm-ai:8000) 때문에 같은 네트워크에 있어야 한다.
#
# Ollama는 이 스택에 포함하지 않는다 — 호스트(또는 별도 컨테이너)에서 이미 구동 중이라고 가정하고
# api 컨테이너가 OLLAMA_HOST로 접근한다. 호스트 Ollama에 접근하려면 extra_hosts(host-gateway)로
# host.docker.internal을 리눅스에서도 쓸 수 있게 한다(Docker Engine >=20.10).

name: smartfarm-ai-home

networks:
  shared-net:
    external: true

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: smartfarm-ai
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 1 --http h11
    extra_hosts:
      # Linux Docker Engine은 host.docker.internal을 기본 제공하지 않음 — Mac/Windows와 동일하게
      # 쓰려면 host-gateway 매핑이 필요(OLLAMA_HOST=http://host.docker.internal:11434 로 .env 설정).
      - "host.docker.internal:host-gateway"
    environment:
      # workers=1과 함께 OCI systemd 유닛(deploy/smartfarm-api.service)과 동일하게 스레드 1개로 고정
      # — 3코어 CPU 서버에서 torch 내부 스레드 경합을 줄인다(기존 운영 설정 이식).
      OMP_NUM_THREADS: "1"
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_HOST: ${OLLAMA_HOST}
      EMBED_MODEL: ${EMBED_MODEL}
      OLLAMA_WRITER_MODEL: ${OLLAMA_WRITER_MODEL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      RAG_BACKEND: ${RAG_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY}
      FARM_LAT: ${FARM_LAT:-37.5665}
      FARM_LON: ${FARM_LON:-126.9780}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      # ~ 사용 금지 — sudo 헬퍼(root)로 실행하면 ~가 /root로 풀린다. env-file의 DATA_DIR(절대경로)로
      # 주입하고, 미설정 시 :?로 즉시 실패시켜 잘못된 경로 마운트를 차단.
      # models는 추론 시 읽기만 하므로 :ro(최소권한) — data는 처방/캐시 등 쓰기가 필요해 RW 유지.
      - ${DATA_DIR:?required}/models:/app/models:ro
      - ${DATA_DIR:?required}/data:/app/data
    networks:
      - default
      - shared-net
    ports:
      # 로컬 스모크 전용 바인딩 — smartfarm-service backend는 shared-net의 컨테이너명으로 접근하므로
      # 이 퍼블리시는 배포 워크플로우 헬스체크·수동 점검용(외부 노출 아님, 127.0.0.1 한정).
      - "127.0.0.1:8000:8000"
    healthcheck:
      # slim 베이스에 curl 없음 — 표준 라이브러리 urllib으로 대체
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  streamlit:
    build:
      context: ../..
      dockerfile: Dockerfile
    # 고정 이름(#88) — smartfarm_service 스택의 cloudflared가 shared-net에서 컨테이너명 DNS로 찾는다
    # (Cloudflare Public Hostname smartfarm-ai.luma200ok.com → http://smartfarm-ai-streamlit:8501).
    container_name: smartfarm-ai-streamlit
    restart: unless-stopped
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 같은 compose 스택의 api 서비스를 컨테이너명으로 직접 호출(shared-net 불필요 — 같은 default 네트워크)
      # — streamlit은 in-process 추론 대신 SMARTFARM_API_URL 경유로만 동작하므로 Ollama/DB 관련
      # env(OLLAMA_*·RAG_BACKEND·DATABASE_URL)는 api 서비스에만 필요(최소권한, 리뷰 P2-1).
      SMARTFARM_API_URL: http://smartfarm-ai:8000
      OMP_NUM_THREADS: "1"
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY}
      FARM_LAT: ${FARM_LAT:-37.5665}
      FARM_LON: ${FARM_LON:-126.9780}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - ${DATA_DIR:?required}/models:/app/models:ro
      - ${DATA_DIR:?required}/data:/app/data
    networks:
      - default
      # 터널 서빙 경로(#88) — cloudflared가 shared-net으로 직접 붙는다. api 호출은 여전히
      # 같은 스택 default 네트워크(SMARTFARM_API_URL)로만 나가므로 노출 면적은 늘지 않는다.
      - shared-net
    ports:
      # 로컬 스모크 전용 유지 — 외부 노출은 cloudflared(shared-net) 경유로만 이뤄진다
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
